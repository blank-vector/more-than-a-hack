[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "possession"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
search-path = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
